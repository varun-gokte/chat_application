name: Keep Apps Awake

on:
  schedule:
    # Runs every 10 minutes, but the workflow itself checks the time window
    - cron: '*/10 * * * *'
  workflow_dispatch:  # lets you trigger it manually from the Actions tab too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check if within active window (UTC)
        id: check_time
        run: |
          HOUR=$(date -u +%H)
          if [ "$HOUR" -ge 4 ] && [ "$HOUR" -lt 15 ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ping Node app
        if: steps.check_time.outputs.active == 'true'
        run: curl -sSf https://chat-application-4an4.onrender.com/health || true

      - name: Ping FastAPI app
        if: steps.check_time.outputs.active == 'true'
        run: curl -sSf https://document-chat-hduw.onrender.com/health || true